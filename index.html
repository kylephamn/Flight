<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge request ECAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #D7DBDF;
    --ink: #1B2129;
    --muted: #586371;
    --line: #B9C0C7;
    --field: #EEF1F3;
    --bezel: #3B4047;
    --bezel-hi: #4A5058;
    --bezel-edge: #24282D;
    --key: #2B2F35;
    --key-edge: #16191C;
    --key-text: #E9ECEF;
    --screen: #000000;
    --green: #3CE07A;
    --cyan: #3FD6E8;
    --white: #F2F4F6;
    --amber: #FFB020;
    --red: #FF3B30;
    --dim: #46525C;
    --ground: #7A5531;
    --pip-on: #1F9A55;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0F1317;
      --ink: #E4E8EC;
      --muted: #93A0AC;
      --line: #2B333C;
      --field: #171C22;
      --bezel: #2A2E34;
      --bezel-hi: #383D44;
      --bezel-edge: #181B1F;
      --key: #22262B;
      --key-edge: #0E1012;
      --key-text: #E9ECEF;
      --screen: #000000;
      --green: #3CE07A;
      --cyan: #3FD6E8;
      --white: #F2F4F6;
      --amber: #FFB020;
      --red: #FF3B30;
      --dim: #46525C;
      --ground: #7A5531;
      --pip-on: #3CE07A;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 400 16px/1.55 "B612", system-ui, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 18px 56px; }
  h1 { font: 700 clamp(24px, 4vw, 36px)/1.15 "B612", sans-serif; margin: 0 0 6px; }
  .intro { margin: 0 0 24px; color: var(--muted); max-width: 60ch; }

  .bezel { background: var(--bezel); border: 1px solid var(--bezel-edge); border-radius: 16px; padding: 18px; box-shadow: inset 0 1px 0 var(--bezel-hi); }
  .screen { background: var(--screen); border-radius: 4px; border: 3px solid var(--bezel-edge); margin-bottom: 14px; }
  .screen svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "B612 Mono", ui-monospace, monospace; }

  .panel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 6px 2px 2px; }
  .key {
    font: 700 15px/1 "B612", sans-serif; color: var(--key-text); background: var(--key);
    border: 1px solid var(--key-edge); border-radius: 6px; padding: 12px 4px 10px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    box-shadow: 0 2px 0 var(--key-edge); -webkit-tap-highlight-color: transparent;
  }
  .key:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--key-edge); }
  .key:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .key .lamp { width: 26px; height: 4px; border-radius: 2px; background: #12301E; }
  .key.lit .lamp { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .key:disabled { opacity: .45; cursor: default; }
  .key small { font: 400 11px/1 "B612", sans-serif; color: #9AA4AE; }

  .fleet { margin-top: 32px; }
  .fleet-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin-bottom: 14px; }
  .fleet h2 { font: 700 22px/1.2 "B612", sans-serif; margin: 0; }
  .count { display: flex; align-items: center; gap: 10px; }
  .count label { color: var(--muted); font-size: 15px; }
  .stepper { display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .stepper button { all: unset; cursor: pointer; width: 38px; height: 38px; text-align: center; font: 700 20px/38px "B612", sans-serif; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .stepper input {
    width: 48px; height: 38px; border: 0; border-left: 1.5px solid var(--ink); border-right: 1.5px solid var(--ink);
    text-align: center; font: 700 17px "B612 Mono", monospace; background: var(--field); color: var(--ink);
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button, .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .reset { font: 700 14px/1 "B612", sans-serif; padding: 11px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }

  .flights { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .flight { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .flight.sel { background: var(--field); box-shadow: inset 3px 0 0 var(--ink); }
  .pick { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
  .pick:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .flight.sel .pick { border-color: var(--ink); }
  .flight.sel .pick::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
  .name { font: 400 16px "B612", sans-serif; color: var(--ink); background: transparent; border: 0; border-bottom: 1px dashed transparent; padding: 4px 0; width: 100%; min-width: 0; }
  .name:hover, .name:focus { border-bottom-color: var(--muted); outline: none; }
  .where { display: flex; align-items: center; gap: 12px; }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 14px; height: 6px; border-radius: 1px; background: var(--line); }
  .pips i.on { background: var(--pip-on); }
  .phase { font: 400 13px "B612 Mono", monospace; color: var(--muted); width: 9ch; text-align: right; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (max-width: 640px) {
    main { padding: 24px 10px 120px; }
    .bezel { padding: 10px; border-radius: 12px; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bezel); border-top: 1px solid var(--bezel-edge); padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); z-index: 10; gap: 8px; }
    .key { font-size: 13px; }
    .phase { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Merge request ECAM</h1>
  <p class="intro">Each merge request flies from the feature branch into protected. Set how many you are tracking, pick one, and press CLR to advance it.</p>

  <div class="bezel">
    <div class="screen"><svg id="ewd" viewBox="0 0 800 440" role="img" aria-label="Upper ECAM, engine and memo display"></svg></div>
    <div class="screen"><svg id="sd" viewBox="0 0 800 440" role="img" aria-label="Lower ECAM, flight profile display"></svg></div>
    <div class="panel">
      <button class="key" id="kRcl"><span class="lamp"></span>RCL<small>Back</small></button>
      <button class="key" id="kClr"><span class="lamp"></span>CLR<small>Next</small></button>
      <button class="key" id="kAll"><span class="lamp"></span>ALL<small>Play</small></button>
      <button class="key" id="kFlt"><span class="lamp"></span>FLT<small>Switch</small></button>
      <button class="key" id="kSts"><span class="lamp"></span>STS<small>Summary</small></button>
    </div>
  </div>

  <section class="fleet">
    <div class="fleet-head">
      <h2>Merge requests</h2>
      <div class="count">
        <label for="countIn">How many</label>
        <div class="stepper">
          <button id="dec" aria-label="Remove a merge request">&minus;</button>
          <input id="countIn" type="number" min="1" max="10" inputmode="numeric">
          <button id="inc" aria-label="Add a merge request">+</button>
        </div>
        <button class="reset" id="reset">Reset all</button>
      </div>
    </div>
    <ul class="flights" id="flights"></ul>
  </section>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<script>
const STAGES = [
  { name: "Last story merged into feature", short: "LAST STORY IN", phase: "TAXI", extra: [], thr: "IDLE", n1: 24.6, spd: 18, alt: 0, vs: 0, gw: 1183400, at: [40, 300] },
  { name: "Reviewers assigned", short: "IN REVIEW", phase: "LINE UP", extra: [], thr: "IDLE", n1: 21.8, spd: 0, alt: 0, vs: 0, gw: 1182900, at: [110, 300] },
  { name: "Testing started", short: "TESTING", phase: "T.O", extra: ["GEAR UP"], thr: "TOGA", n1: 93.4, spd: 165, alt: 800, vs: 2400, gw: 1181100, at: [252, 262] },
  { name: "Testing finished, accepted by SME", short: "SME ACCEPTED", phase: "FINAL APP", extra: ["GEAR DN"], thr: "CL", n1: 48.2, spd: 140, alt: 1500, vs: -700, gw: 1052600, at: [478, 245] },
  { name: "Merged into protected", short: "MERGED", phase: "LANDED", extra: [], thr: "IDLE", n1: 20.4, spd: 0, alt: 0, vs: 0, gw: 1051800, at: [570, 300] }
];
const TO_MEMO = [
  { l: "LAST STORY", r: "MERGED", s: 0 },
  { l: "REVIEWERS", r: "ASSIGNED", s: 1 },
  { l: "TESTING", r: "STARTED", s: 2 }
];
const LDG_MEMO = [
  { l: "TESTING", r: "COMPLETE", s: 3 },
  { l: "SME", r: "ACCEPTED", s: 3 },
  { l: "MR", r: "MERGED TO PROTECTED", s: 4 }
];
const LAST = STAGES.length - 1, MAX = 10;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";
const C = v => `var(--${v})`;
const el = (parent, tag, attrs = {}, text) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e);
  return e;
};
const dotted = (l, r, w = 32) => `${l} ${".".repeat(Math.max(2, w - l.length - r.length - 2))} ${r}`;

/* ---------- Fleet state ---------- */
let fleet = [{ name: "MR 1", stage: 0 }, { name: "MR 2", stage: 0 }, { name: "MR 3", stage: 0 }];
let sel = 0;
const KEY = "mr-ecam-fleet";
const hasStore = () => typeof window.storage === "object" && window.storage;
const hasLocal = (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; } catch { return false; } })();
async function load() {
  let raw = null;
  try {
    if (hasLocal) raw = localStorage.getItem(KEY);
    else if (hasStore()) { const r = await window.storage.get(KEY, false); raw = r && r.value; }
    const d = raw && JSON.parse(raw);
    if (d && Array.isArray(d.fleet) && d.fleet.length) { fleet = d.fleet.slice(0, MAX); sel = Math.min(d.sel || 0, fleet.length - 1); }
  } catch (e) { /* first visit or unreadable data */ }
}
function save() {
  const data = JSON.stringify({ fleet, sel });
  try {
    if (hasLocal) localStorage.setItem(KEY, data);
    else if (hasStore()) window.storage.set(KEY, data, false);
  } catch (e) {}
}

/* ---------- Upper ECAM ---------- */
const ewd = document.getElementById("ewd");
const GAUGE_X = [110, 270, 530, 690], GY = 120, GR = 58;
const ang = v => (210 - (Math.min(v, 110) / 110) * 240) * Math.PI / 180;
const pt = (cx, r, v) => [cx + r * Math.cos(ang(v)), GY - r * Math.sin(ang(v))];
const needles = [], readouts = [];
GAUGE_X.forEach((cx, i) => {
  const [x0, y0] = pt(cx, GR, 0), [x1, y1] = pt(cx, GR, 100), [x2, y2] = pt(cx, GR, 110);
  el(ewd, "path", { d: `M${x0} ${y0} A${GR} ${GR} 0 1 1 ${x1} ${y1}`, fill: "none", stroke: C("white"), "stroke-width": 2.5 });
  el(ewd, "path", { d: `M${x1} ${y1} A${GR} ${GR} 0 0 1 ${x2} ${y2}`, fill: "none", stroke: C("red"), "stroke-width": 4 });
  [[0, ""], [50, "5"], [100, "10"]].forEach(([v, lab]) => {
    const [a, b] = pt(cx, GR, v), [c, d] = pt(cx, GR - 9, v);
    el(ewd, "line", { x1: a, y1: b, x2: c, y2: d, stroke: C("white"), "stroke-width": 2 });
    if (lab) { const [tx, ty] = pt(cx, GR - 22, v); el(ewd, "text", { x: tx, y: ty + 5, "text-anchor": "middle", "font-size": 14, fill: C("white") }, lab); }
  });
  needles.push(el(ewd, "line", { x1: cx, y1: GY, x2: cx, y2: GY, stroke: C("green"), "stroke-width": 3, "stroke-linecap": "round" }));
  el(ewd, "rect", { x: cx - 32, y: GY + 20, width: 64, height: 26, fill: "none", stroke: C("dim"), "stroke-width": 1.5 });
  readouts.push(el(ewd, "text", { x: cx + 26, y: GY + 39, "text-anchor": "end", "font-size": 19, fill: C("green") }, "0.0"));
  el(ewd, "text", { x: cx, y: GY + 78, "text-anchor": "middle", "font-size": 14, fill: C("white") }, String(i + 1));
});
el(ewd, "text", { x: 400, y: 112, "text-anchor": "middle", "font-size": 18, fill: C("white") }, "N1");
el(ewd, "text", { x: 400, y: 134, "text-anchor": "middle", "font-size": 14, fill: C("cyan") }, "%");
const fltName = el(ewd, "text", { x: 24, y: 28, "font-size": 18, fill: C("white") }, "");
const fltIdx = el(ewd, "text", { x: 24, y: 48, "font-size": 13, fill: C("cyan") }, "");
const thrMode = el(ewd, "text", { x: 690, y: 28, "text-anchor": "end", "font-size": 18, fill: C("cyan") }, "IDLE");
const thrVal = el(ewd, "text", { x: 780, y: 28, "text-anchor": "end", "font-size": 18, fill: C("green") }, "");
el(ewd, "line", { x1: 12, y1: 232, x2: 788, y2: 232, stroke: C("white"), "stroke-width": 1.5 });
el(ewd, "line", { x1: 500, y1: 232, x2: 500, y2: 428, stroke: C("white"), "stroke-width": 1.5 });
const memoTitle = el(ewd, "text", { x: 30, y: 268, "font-size": 18, fill: C("white"), "text-decoration": "underline" }, "T.O MEMO");
const memoLines = [0, 1, 2].map(k => ({
  box: el(ewd, "rect", { x: 22, y: 286 + k * 34, width: 360, height: 28, fill: "none", stroke: C("white"), "stroke-width": 1.5, opacity: 0 }),
  text: el(ewd, "text", { x: 30, y: 306 + k * 34, "font-size": 17, fill: C("cyan"), "xml:space": "preserve" }, "")
}));
const rightLines = [0, 1, 2, 3].map(k => el(ewd, "text", { x: 520, y: 268 + k * 32, "font-size": 18, fill: C("green") }, ""));
let blinkTimer;

function renderMemo(i, blink) {
  const set = i <= 2 ? TO_MEMO : LDG_MEMO;
  memoTitle.textContent = i <= 2 ? "T.O MEMO" : "LDG MEMO";
  memoLines.forEach((m, k) => {
    const it = set[k];
    m.text.textContent = dotted(it.l, it.r);
    const done = it.s < i || i === LAST, active = it.s === i && i !== LAST;
    m.text.setAttribute("fill", done ? C("green") : active ? C("white") : C("cyan"));
    m.box.setAttribute("opacity", active ? 1 : 0);
  });
  const st = STAGES[i];
  clearInterval(blinkTimer);
  const lines = [st.phase, ...st.extra];
  rightLines.forEach((t, k) => { t.textContent = lines[k] || ""; t.style.visibility = "visible"; t.setAttribute("fill", C("green")); });
  const landed = fleet.filter(f => f.stage === LAST).length;
  rightLines[3].textContent = `${landed}/${fleet.length} LANDED`;
  rightLines[3].setAttribute("fill", C("cyan"));
  if (i === LAST) {
    const t = rightLines[2];
    t.textContent = "LDG MEMO COMPLETE";
    if (blink && !reduce) {
      let n = 0;
      blinkTimer = setInterval(() => {
        t.style.visibility = t.style.visibility === "hidden" ? "visible" : "hidden";
        if (++n >= 6) { clearInterval(blinkTimer); t.style.visibility = "visible"; }
      }, 280);
    }
  }
  thrMode.textContent = st.thr;
  thrVal.textContent = st.thr === "IDLE" ? "" : st.thr === "TOGA" ? "94.0" : "84.6";
  const f = fleet[sel];
  fltName.textContent = f.name.toUpperCase().slice(0, 24);
  fltIdx.textContent = `FLT ${sel + 1} OF ${fleet.length}`;
}

/* ---------- Lower ECAM ---------- */
const sd = document.getElementById("sd");
el(sd, "text", { x: 24, y: 34, "font-size": 18, fill: C("white"), "text-decoration": "underline" }, "PROFILE");
const tally = STAGES.map((s, k) => {
  const x = 24 + k * 116;
  el(sd, "text", { x, y: 66, "font-size": 13, fill: C("white") }, ["TAXI", "LINE UP", "T.O", "APP", "LDG"][k]);
  return el(sd, "text", { x: x + 84, y: 66, "text-anchor": "end", "font-size": 15, fill: C("green") }, "0");
});
const D = "M 40 300 L 110 300 L 175 300 C 210 300 235 278 265 248 C 310 200 340 160 385 160 C 425 160 450 200 478 245 C 500 280 512 300 535 300 L 570 300";
[110, 200].forEach((y, k) => {
  el(sd, "line", { x1: 30, y1: y, x2: 590, y2: y, stroke: C("dim"), "stroke-dasharray": "2 8" });
  el(sd, "text", { x: 30, y: y - 6, "font-size": 12, fill: C("dim") }, k ? "FL25" : "FL50");
});
el(sd, "line", { x1: 30, y1: 300, x2: 590, y2: 300, stroke: C("ground"), "stroke-width": 2 });
el(sd, "rect", { x: 90, y: 300, width: 150, height: 4, fill: C("white"), opacity: .55 });
el(sd, "rect", { x: 500, y: 300, width: 85, height: 4, fill: C("white"), opacity: .55 });
const track = el(sd, "path", { d: D, fill: "none", stroke: C("green"), "stroke-width": 1.5, "stroke-dasharray": "5 6", opacity: .45 });
const flown = el(sd, "path", { d: D, fill: "none", stroke: C("green"), "stroke-width": 2.5 });
[[110, "FEATURE"], [535, "PROTECTED"]].forEach(([x, n]) => {
  el(sd, "path", { d: `M${x} 316 l7 9 l-7 9 l-7 -9 z`, fill: "none", stroke: C("white"), "stroke-width": 1.5 });
  el(sd, "text", { x, y: 356, "text-anchor": "middle", "font-size": 14, fill: C("white") }, n);
});
const others = el(sd, "g");

const plane = el(sd, "g", { fill: "none", stroke: C("white"), "stroke-width": 5, "stroke-linejoin": "round" });
el(plane, "path", { d: "M 112 6 C 112 -6 101 -18 82 -20 L -60 -20 C -80 -20 -96 -15 -114 -10 L -117 -5 C -100 1 -82 10 -60 14 L 82 14 C 100 14 112 12 112 6 Z" });
el(plane, "path", { d: "M -66 -20 L -98 -64 L -116 -64 L -113 -12" });
el(plane, "line", { x1: -60, y1: -4, x2: 100, y2: -4, "stroke-width": 3.5 });
el(plane, "path", { d: "M 34 9 L -44 -1 L -54 2 L 12 15" });
el(plane, "rect", { x: -2, y: 14, width: 28, height: 10, rx: 5 });
const planeGear = el(plane, "g", { stroke: C("green") });
[[92, 14], [-14, 14], [-30, 13]].forEach(([x, y]) => el(planeGear, "line", { x1: x, y1: y, x2: x, y2: 28 }));

el(sd, "line", { x1: 604, y1: 20, x2: 604, y2: 370, stroke: C("white"), "stroke-width": 1.5 });
el(sd, "text", { x: 624, y: 46, "font-size": 15, fill: C("white") }, "LDG GEAR");
const gearTris = [654, 700, 746].map(x => el(sd, "path", { d: `M${x - 13} 62 h26 l-13 22 z`, fill: C("green"), stroke: C("green"), "stroke-width": 1.5 }));
[[654, "L"], [700, "NOSE"], [746, "R"]].forEach(([x, t]) => el(sd, "text", { x, y: 104, "text-anchor": "middle", "font-size": 11, fill: C("dim") }, t));
const readout = (label, unit, y) => {
  el(sd, "text", { x: 624, y, "font-size": 14, fill: C("cyan") }, label);
  el(sd, "text", { x: 780, y, "text-anchor": "end", "font-size": 13, fill: C("cyan") }, unit);
  return el(sd, "text", { x: 780, y: y + 34, "text-anchor": "end", "font-size": 30, fill: C("green") }, "0");
};
const spdT = readout("SPD", "KT", 150), altT = readout("ALT", "FT", 228), vsT = readout("V/S", "FPM", 306);
el(sd, "line", { x1: 12, y1: 380, x2: 788, y2: 380, stroke: C("white"), "stroke-width": 1.5 });
[["TAT", 405], ["SAT", 428]].forEach(([l, y], k) => {
  el(sd, "text", { x: 24, y, "font-size": 15, fill: C("white") }, l);
  el(sd, "text", { x: 70, y, "font-size": 15, fill: C("green") }, k ? "+10" : "+12");
  el(sd, "text", { x: 112, y, "font-size": 15, fill: C("cyan") }, "°C");
});
const utcT = el(sd, "text", { x: 400, y: 418, "text-anchor": "middle", "font-size": 20, fill: C("green") }, "");
el(sd, "text", { x: 560, y: 418, "font-size": 15, fill: C("white") }, "GW");
const gwT = el(sd, "text", { x: 740, y: 418, "text-anchor": "end", "font-size": 18, fill: C("green") }, "");
el(sd, "text", { x: 780, y: 418, "text-anchor": "end", "font-size": 13, fill: C("cyan") }, "LB");

const sts = el(sd, "g", { visibility: "hidden" });
el(sts, "rect", { x: 0, y: 0, width: 800, height: 378, fill: C("screen") });
el(sts, "text", { x: 24, y: 34, "font-size": 18, fill: C("white"), "text-decoration": "underline" }, "STATUS");
const stsSub = el(sts, "text", { x: 776, y: 34, "text-anchor": "end", "font-size": 14, fill: C("cyan") }, "");
const stsLines = Array.from({ length: MAX }, (_, k) => ({
  box: el(sts, "rect", { x: 30, y: 54 + k * 31, width: 740, height: 27, fill: "none", stroke: C("white"), "stroke-width": 1.5, opacity: 0 }),
  text: el(sts, "text", { x: 40, y: 73 + k * 31, "font-size": 16, fill: C("cyan") }, ""),
  phase: el(sts, "text", { x: 470, y: 73 + k * 31, "font-size": 16, fill: C("cyan") }, ""),
  short: el(sts, "text", { x: 600, y: 73 + k * 31, "font-size": 16, fill: C("cyan") }, "")
}));

/* ---------- Motion ---------- */
const total = track.getTotalLength();
flown.style.strokeDasharray = total;
const nearestLen = (x, y) => {
  let best = 0, bd = Infinity;
  for (let l = 0; l <= total; l++) {
    const p = track.getPointAtLength(l), d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = l; }
  }
  return best;
};
STAGES.forEach(s => s.len = nearestLen(...s.at));
const gearUpLen = nearestLen(245, 268), gearDnLen = nearestLen(440, 190);
const OFFS = [0, .4, -.3, .2];
const cur = { len: STAGES[0].len, n1: STAGES[0].n1, spd: 18, alt: 0, vs: 0, gw: STAGES[0].gw };

function draw() {
  const p = track.getPointAtLength(cur.len);
  const a = track.getPointAtLength(Math.max(cur.len - 3, 0)), b = track.getPointAtLength(Math.min(cur.len + 3, total));
  const an = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  const pitch = an < 0 ? Math.max(an * .45, -13) : Math.min(an * .08, 3);
  plane.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${pitch}) scale(.22) translate(0 -30)`);
  flown.style.strokeDashoffset = total - cur.len;
  const down = cur.len < gearUpLen || cur.len > gearDnLen;
  planeGear.style.visibility = down ? "visible" : "hidden";
  gearTris.forEach(t => { t.setAttribute("fill", down ? C("green") : "none"); t.setAttribute("stroke", down ? C("green") : C("dim")); });
  GAUGE_X.forEach((cx, i) => {
    const v = Math.max(0, cur.n1 + OFFS[i] * (cur.n1 / 50));
    const [x, y] = pt(cx, GR + 4, v);
    needles[i].setAttribute("x2", x); needles[i].setAttribute("y2", y);
    readouts[i].textContent = v.toFixed(1);
  });
  spdT.textContent = Math.round(cur.spd);
  altT.textContent = Math.round(cur.alt).toLocaleString();
  const vs = Math.round(cur.vs / 100) * 100;
  vsT.textContent = vs > 0 ? "+" + vs.toLocaleString() : vs.toLocaleString();
  gwT.textContent = (Math.round(cur.gw / 100) * 100).toLocaleString();
}

let raf;
function flyTo(s) {
  return new Promise(res => {
    cancelAnimationFrame(raf);
    const from = { ...cur };
    const to = { len: s.len, n1: s.n1, spd: s.spd, alt: s.alt, vs: s.vs, gw: s.gw };
    if (reduce) { Object.assign(cur, to); draw(); return res(); }
    const dur = Math.max(900, Math.abs(to.len - from.len) * 4.2);
    const t0 = performance.now();
    const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const step = now => {
      const t = Math.min((now - t0) / dur, 1), e = ease(t), ef = Math.min(1, t * 1.8);
      for (const k in to) cur[k] = from[k] + (to[k] - from[k]) * (k === "n1" ? ef : e);
      draw();
      if (t < 1) raf = requestAnimationFrame(step); else res();
    };
    raf = requestAnimationFrame(step);
  });
}

/* ---------- Fleet-wide displays ---------- */
function renderOthers() {
  others.replaceChildren();
  STAGES.forEach((s, k) => {
    const n = fleet.filter((f, j) => f.stage === k && j !== sel).length;
    if (!n) return;
    const p = track.getPointAtLength(s.len);
    const y = k === 0 || k === 1 || k === LAST ? p.y - 30 : p.y - 26;
    el(others, "rect", { x: p.x - 13, y: y - 13, width: 26, height: 20, rx: 3, fill: "none", stroke: C("cyan"), "stroke-width": 1.5 });
    el(others, "text", { x: p.x, y: y + 2, "text-anchor": "middle", "font-size": 14, fill: C("cyan") }, String(n));
  });
  tally.forEach((t, k) => t.textContent = fleet.filter(f => f.stage === k).length);
}

function renderSts() {
  stsSub.textContent = `${fleet.filter(f => f.stage === LAST).length} OF ${fleet.length} LANDED`;
  stsLines.forEach((l, k) => {
    const f = fleet[k];
    if (!f) { l.text.textContent = l.phase.textContent = l.short.textContent = ""; l.box.setAttribute("opacity", 0); return; }
    const name = f.name.toUpperCase().slice(0, 24);
    l.text.textContent = `${name} ${".".repeat(Math.max(2, 38 - name.length))}`;
    l.phase.textContent = STAGES[f.stage].phase;
    l.short.textContent = STAGES[f.stage].short;
    const col = f.stage === LAST ? C("green") : k === sel ? C("white") : C("cyan");
    [l.text, l.phase, l.short].forEach(t => t.setAttribute("fill", col));
    l.box.setAttribute("opacity", k === sel ? 1 : 0);
  });
}

/* ---------- Fleet list UI ---------- */
const list = document.getElementById("flights");
const countIn = document.getElementById("countIn");
const dec = document.getElementById("dec"), inc = document.getElementById("inc");

function renderList() {
  list.replaceChildren();
  fleet.forEach((f, j) => {
    const li = document.createElement("li");
    li.className = "flight" + (j === sel ? " sel" : "");
    li.innerHTML = `
      <button class="pick" aria-label="Show ${f.name} on the ECAM" aria-pressed="${j === sel}"></button>
      <input class="name" aria-label="Merge request name" maxlength="40">
      <span class="where"><span class="pips">${STAGES.map((_, k) => `<i class="${k <= f.stage ? "on" : ""}"></i>`).join("")}</span><span class="phase">${STAGES[f.stage].phase}</span></span>`;
    const inp = li.querySelector(".name");
    inp.value = f.name;
    inp.addEventListener("input", () => {
      fleet[j].name = inp.value || `MR ${j + 1}`;
      if (j === sel) renderMemo(fleet[sel].stage, false);
      if (stsOn) renderSts();
      save();
    });
    inp.addEventListener("focus", () => { if (sel !== j) select(j, false); });
    li.querySelector(".pick").onclick = () => select(j);
    list.appendChild(li);
  });
  countIn.value = fleet.length;
  dec.disabled = fleet.length <= 1;
  inc.disabled = fleet.length >= MAX;
}

function setCount(n) {
  n = Math.max(1, Math.min(MAX, Math.round(n) || 1));
  while (fleet.length < n) fleet.push({ name: `MR ${fleet.length + 1}`, stage: 0 });
  fleet.length = n;
  if (sel >= n) sel = n - 1;
  refresh(false);
  flyTo(STAGES[fleet[sel].stage]);
  save();
}
dec.onclick = () => setCount(fleet.length - 1);
inc.onclick = () => setCount(fleet.length + 1);
countIn.addEventListener("change", () => setCount(+countIn.value));
document.getElementById("reset").onclick = () => {
  fleet.forEach(f => f.stage = 0);
  stopPlay(); refresh(false); flyTo(STAGES[0]); save();
};

/* ---------- Controls ---------- */
const kRcl = document.getElementById("kRcl"), kClr = document.getElementById("kClr");
const kAll = document.getElementById("kAll"), kSts = document.getElementById("kSts"), kFlt = document.getElementById("kFlt");
const live = document.getElementById("live");
let playing = false, stsOn = false;

const flash = k => { k.classList.add("lit"); setTimeout(() => k.classList.remove("lit"), 350); };
function showSts(on) {
  stsOn = on;
  sts.setAttribute("visibility", on ? "visible" : "hidden");
  kSts.classList.toggle("lit", on);
  if (on) renderSts();
}

function refresh(blink, rebuildList = true) {
  const i = fleet[sel].stage;
  renderMemo(i, blink);
  renderOthers();
  if (stsOn) renderSts();
  if (rebuildList) renderList();
  kRcl.disabled = i === 0;
  kClr.disabled = i === LAST;
  kFlt.disabled = fleet.length < 2;
}

function setStage(i) {
  if (i < 0 || i > LAST) return;
  fleet[sel].stage = i;
  refresh(i === LAST);
  live.textContent = `${fleet[sel].name}, step ${i + 1} of 5: ${STAGES[i].name}.`;
  save();
  return flyTo(STAGES[i]);
}
function select(j, focusKeepsList = true) {
  stopPlay();
  sel = j;
  refresh(false, focusKeepsList);
  if (!focusKeepsList) {
    [...list.children].forEach((li, k) => {
      li.classList.toggle("sel", k === sel);
      li.querySelector(".pick").setAttribute("aria-pressed", k === sel);
    });
  }
  live.textContent = `Showing ${fleet[sel].name}: ${STAGES[fleet[sel].stage].name}.`;
  save();
  flyTo(STAGES[fleet[sel].stage]);
}
function stopPlay() { playing = false; kAll.classList.remove("lit"); }

kClr.onclick = () => { stopPlay(); flash(kClr); if (stsOn) showSts(false); setStage(fleet[sel].stage + 1); };
kRcl.onclick = () => { stopPlay(); flash(kRcl); if (stsOn) showSts(false); setStage(fleet[sel].stage - 1); };
kFlt.onclick = () => { flash(kFlt); select((sel + 1) % fleet.length); };
kSts.onclick = () => showSts(!stsOn);
kAll.onclick = async () => {
  if (playing) return stopPlay();
  playing = true; kAll.classList.add("lit");
  if (stsOn) showSts(false);
  await setStage(0);
  for (let i = 1; i <= LAST && playing; i++) {
    await new Promise(r => setTimeout(r, 1000));
    if (!playing) break;
    await setStage(i);
  }
  stopPlay();
};
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "ArrowRight" && !kClr.disabled) kClr.click();
  if (e.key === "ArrowLeft" && !kRcl.disabled) kRcl.click();
  if ((e.key === "ArrowDown" || e.key === "ArrowUp") && fleet.length > 1) {
    e.preventDefault();
    select((sel + (e.key === "ArrowDown" ? 1 : -1) + fleet.length) % fleet.length);
  }
});

const tickUtc = () => {
  const d = new Date();
  utcT.textContent = `${String(d.getUTCHours()).padStart(2, "0")} H ${String(d.getUTCMinutes()).padStart(2, "0")}`;
};
tickUtc(); setInterval(tickUtc, 15000);

(async () => {
  await load();
  Object.assign(cur, { len: STAGES[fleet[sel].stage].len, n1: STAGES[fleet[sel].stage].n1, spd: STAGES[fleet[sel].stage].spd, alt: STAGES[fleet[sel].stage].alt, vs: STAGES[fleet[sel].stage].vs, gw: STAGES[fleet[sel].stage].gw });
  refresh(false);
  draw();
})();
</script>
</body>
</html>
